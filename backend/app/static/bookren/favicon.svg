<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <!-- Rounded square background — dark navy -->
  <rect width="64" height="64" rx="12" fill="#1a2a4a"/>

  <!-- Left book page — bold blue, thick enough to read at 16px -->
  <rect x="6" y="8" width="23" height="48" rx="4" fill="#2d6be4"/>

  <!-- Right book page -->
  <rect x="35" y="8" width="23" height="48" rx="4" fill="#2d6be4"/>

  <!-- Centre spine — dark gap between pages -->
  <rect x="28" y="8" width="8" height="48" fill="#1a2a4a"/>

  <!-- Three bold text lines on right page — white, thick enough for small sizes -->
  <rect x="40" y="20" width="13" height="4" rx="2" fill="white"/>
  <rect x="40" y="29" width="10" height="4" rx="2" fill="white"/>
  <rect x="40" y="38" width="12" height="4" rx="2" fill="white"/>

  <!-- Magnifying glass — amber ring, very thick stroke so it reads at 16px -->
  <!-- Ring -->
  <circle cx="20" cy="33" r="10" fill="none" stroke="#F5A623" stroke-width="5"/>
  <!-- Glass interior — blue so it looks like a lens -->
  <circle cx="20" cy="33" r="5.5" fill="#2d6be4"/>
  <!-- Handle — thick, angled down-right -->
  <line x1="27" y1="40" x2="33" y2="46" stroke="#F5A623" stroke-width="6" stroke-linecap="round"/>

</svg>
